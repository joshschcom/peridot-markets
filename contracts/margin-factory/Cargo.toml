[package]
name = "margin-factory"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
peridot-interfaces = { path = "../peridot-interfaces" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
mock-token = { path = "../../core/mocks/mock-token" }
mock-aquarius-pool = { path = "../../core/mocks/mock-aquarius-pool" }
mock-reflector = { path = "../mocks/mock-reflector" }
