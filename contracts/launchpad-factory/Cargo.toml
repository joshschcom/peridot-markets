[package]
name = "launchpad-factory"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
peridot-interfaces = { path = "../peridot-interfaces" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
mock-token = { path = "../../core/mocks/mock-token" }
market-factory = { path = "../market-factory" }
mock-price-router = { path = "../mocks/mock-price-router" }
