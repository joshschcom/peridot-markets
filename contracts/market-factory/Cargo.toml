[package]
name = "market-factory"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
peridot-interfaces = { path = "../peridot-interfaces" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
mock-token = { path = "../../core/mocks/mock-token" }
mock-reflector = { path = "../mocks/mock-reflector" }
mock-yield-vault = { path = "../mocks/mock-yield-vault" }
mock-price-router = { path = "../mocks/mock-price-router" }
