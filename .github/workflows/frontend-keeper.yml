name: Frontend and keeper
on:
  push:
    paths: ['app/**', 'keeper/**', 'contracts/peridot-interfaces/ts/**', '.github/workflows/frontend-keeper.yml']
  pull_request:
    paths: ['app/**', 'keeper/**', 'contracts/peridot-interfaces/ts/**', '.github/workflows/frontend-keeper.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run interfaces:check
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCKS: 'false'
  keeper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper/liquidator/margin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: keeper/liquidator/margin/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Find PostgreSQL binaries
        run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - run: npm test
        env:
          PG_INTEGRATION_TEST: 'true'
